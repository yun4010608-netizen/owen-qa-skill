# Production manifests (namespace: orders)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: registry.example.com/orders/api:1.4.0
          command: ["python", "api.py"]
          env:
            - {name: REDIS_HOST, value: redis}
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 3
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: worker
          image: registry.example.com/orders/worker:1.4.0
          command: ["python", "worker.py"]
          env:
            - {name: REDIS_HOST, value: redis}
            - {name: WORK_SECONDS, value: "3"}
            - {name: STOCK_LOCK_TTL, value: "2"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports:
    - port: 6379
