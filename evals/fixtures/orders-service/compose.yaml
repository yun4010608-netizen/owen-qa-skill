services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build: ./app
    command: ["python", "api.py"]
    environment:
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080-8081:8080"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./app
    command: ["python", "worker.py"]
    environment:
      REDIS_HOST: redis
      WORK_SECONDS: "3"
    depends_on:
      redis:
        condition: service_healthy
